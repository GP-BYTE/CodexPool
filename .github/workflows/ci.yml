name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - name: Check public source
        run: python3 scripts/check_public_export.py --tracked
      - name: Test privacy guard
        run: python3 -m unittest discover -s scripts
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"
      - run: go mod verify
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -trimpath -buildvcs=false -o bin/codexpool ./cmd/codexpool
      - run: go build -trimpath -buildvcs=false -o bin/codexpool-desktop-helper ./cmd/codexpool-desktop-helper
